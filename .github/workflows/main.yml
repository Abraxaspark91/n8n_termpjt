name: Apply Deliverable Patch

# n8n이 deliverables/patches/pending/ 에 패치 JSON을 커밋하면 실행되어
# 기성 docx/xlsx/pptx 를 실제로 갱신하고 결과를 되커밋한다.
on:
  push:
    paths:
      - "patches/pending/**.json"
  workflow_dispatch: {}

permissions:
  contents: write

# 패치가 연달아 커밋돼도 직렬 처리(레이스 방지)
concurrency:
  group: deliverable-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install document libs
        run: pip install --quiet python-docx openpyxl python-pptx

      - name: Apply pending patches to deliverables
        run: python scripts/apply_deliverable_patch.py

      - name: Commit updated deliverables
        run: |
          git config user.name  "w3-doc-engine[bot]"
          git config user.email "w3-doc-engine@users.noreply.github.com"
          git add deliverables/ scenarios/ patches/
          if git diff --cached --quiet; then
            echo "no deliverable changes"
          else
            git commit -m "docs(engine): apply deliverable patch(es) [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
