name: Recover Bench Results

# 중단된 벤치마크의 완료 run 점수를 GitHub 아티팩트에서 재구성 → benchmark/runs/ 커밋
# 사용: Actions 탭 → 이 워크플로 → Run workflow (수동 1클릭)
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # git log로 '(fallback)' 커밋 메시지 조회에 필요
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct completed run results
        run: python scripts/recover_bench_results.py
      - name: Commit recovered results
        run: |
          git config user.name  "w3-bench-recovery[bot]"
          git config user.email "w3-bench-recovery@users.noreply.github.com"
          git add benchmark/runs/
          if git diff --cached --quiet; then
            echo "no recovered results"
          else
            git commit -m "bench: recover run results from artifacts [skip n8n] [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
